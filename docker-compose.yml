services:
  agentmail:
    image: ghcr.io/alexpitcher/agentmail:latest
    container_name: agentmail
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/var/lib/agentmail
    env_file:
      - .env

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agentmail-cloudflared
    restart: unless-stopped
    network_mode: "service:agentmail"
    depends_on:
      - agentmail
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --url
      - http://agentmail:8787
      - --token
      - ${CLOUDFLARED_TUNNEL_TOKEN}

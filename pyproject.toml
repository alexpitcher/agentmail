[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmail"
version = "0.1.0"
description = "Generic email ingestion and retrieval layer for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2.26",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
extract = [
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]
test = [
  "pytest>=8.2",
]

[project.scripts]
agentmail = "agentmail.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
